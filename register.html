<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - MediTrack</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="register.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar">
    <a href="index.html" style="text-decoration:none;">
      <div class="brand">
        <span class="brand-icon">💊</span>
        <h1>MediTrack</h1>
      </div>
    </a>
  </nav>

  <!-- ===================== REGISTRATION FORM ===================== -->
  <main class="auth-page">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="auth-subtext">Register to start tracking your medicine inventory.</p>

      <form id="registerForm" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. Priya Sharma" required />
            <span class="error-msg" id="errFullName"></span>
          </div>

          <div class="form-group">
            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId" placeholder="e.g. EMP1024" required />
            <span class="error-msg" id="errEmployeeId"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="e.g. priya@hospital.com" required />
            <span class="error-msg" id="errEmail"></span>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10-digit number" required />
            <span class="error-msg" id="errMobile"></span>
          </div>

          <div class="form-group">
            <label for="division">Division</label>
            <select id="division" required>
              <option value="">-- Select Division --</option>
              <option value="Pharmacy">Pharmacy</option>
              <option value="Nursing">Nursing</option>
              <option value="Administration">Administration</option>
              <option value="Inventory">Inventory</option>
              <option value="Other">Other</option>
            </select>
            <span class="error-msg" id="errDivision"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 8 chars, mixed case + number + symbol" required />
            <span class="error-msg" id="errPassword"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
            <span class="error-msg" id="errConfirmPassword"></span>
          </div>

        </div>

        <button type="submit">Create Account</button>
      </form>

      <p class="auth-switch">
        Already registered? <a href="signin.html">Sign in here</a>
      </p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
